# DevSecOps pipeline (place this file as .github/workflows/devsecops.yml)
# This is a copy of the CI workflow for convenience in the repo root.

name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '*' ]

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: |
          mkdir -p reports
          set -o pipefail
          pytest -q | tee reports/test-report.txt
      - name: Upload test report
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: reports/test-report.txt

  sast:
    name: SAST - Bandit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies (incl. dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run Bandit (output json+txt)
        run: |
          mkdir -p reports
          python -m bandit -r src -f json -o reports/sast-report.json --exit-zero
          python -m bandit -r src -f txt -o reports/sast-report.txt --exit-zero
          test -s reports/sast-report.json
          test -s reports/sast-report.txt
      - name: Fail on HIGH+HIGH Bandit findings
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path("reports/sast-report.json")
          if not path.exists():
              print("Bandit JSON report missing; SAST scan failed")
              sys.exit(1)

          with path.open(encoding="utf-8") as report:
              data = json.load(report)

          issues = data.get("results", [])
          bad = [
              issue for issue in issues
              if issue.get("issue_severity", "").upper() == "HIGH"
              and issue.get("issue_confidence", "").upper() == "HIGH"
          ]
          print("High severity+confidence Bandit issues found:", bad) if bad else print(
              "No high severity+confidence Bandit issues"
          )
          sys.exit(1 if bad else 0)
          PY
      - name: Upload SAST report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sast-report
          path: |
            reports/sast-report.txt
            reports/sast-report.json
          if-no-files-found: error

  sca:
    name: SCA - Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies (for report tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Create report directory
        run: mkdir -p reports
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          scan-type: fs
          scan-ref: "."
          output: reports/sca-report.txt
          format: table
        env:
          TRIVY_SKIP_DB_UPDATE: 'false'
      - name: Upload SCA report
        uses: actions/upload-artifact@v7
        with:
          name: sca-report
          path: reports/sca-report.txt

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build with Docker Compose
        run: |
          docker compose build --no-cache
      - name: Save image info
        run: |
          mkdir -p reports
          echo "Docker build completed" > reports/build-report.txt
      - name: Upload build report
        uses: actions/upload-artifact@v7
        with:
          name: build-report
          path: reports/build-report.txt

  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: |
          mkdir -p reports
          docker build -t ai-devsecops-demo:ci .
      - name: Create docker network
        run: |
          docker network create zapnet || true
      - name: Run app container on zapnet (published to localhost:8000)
        run: |
          docker run -d --name ai-devsecops-demo --network zapnet -p 8000:8000 ai-devsecops-demo:ci
      - name: Wait for health endpoint (localhost)
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/health -o /dev/null; then
              echo "Service healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App health check failed" >&2
          exit 1
      - name: Run OWASP ZAP (container on zapnet)
        run: |
          mkdir -p reports
          docker run --rm \
            --user root \
            --network zapnet \
            -v ${{ github.workspace }}/reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://ai-devsecops-demo:8000 -r zap-report.html -w zap.md -I || true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: reports/zap-report.html
      - name: Stop app and remove network
        if: always()
        run: |
          docker rm -f ai-devsecops-demo || true
          docker network rm zapnet || true

  report:
    name: Generate combined report
    runs-on: ubuntu-latest
    needs: [tests, sca, sast, dast]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Download test report
        uses: actions/download-artifact@v8
        with:
          name: test-report
          path: reports
      - name: Download SAST report
        uses: actions/download-artifact@v8
        with:
          name: sast-report
          path: reports
      - name: Download SCA report
        uses: actions/download-artifact@v8
        with:
          name: sca-report
          path: reports
      - name: Download ZAP report
        uses: actions/download-artifact@v8
        with:
          name: zap-report
          path: reports
      - name: Generate combined report
        run: |
          python src/app/generate_report.py
      - name: Upload combined report
        uses: actions/upload-artifact@v7
        with:
          name: devsecops-report
          path: reports/devsecops-report.md
