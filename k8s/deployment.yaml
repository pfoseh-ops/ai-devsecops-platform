apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devsecops-demo
  namespace: ai-devsecops
  labels:
    app: ai-devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-devsecops-demo
  template:
    metadata:
      labels:
        app: ai-devsecops-demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Release blocker: replace this marker with a tested sha256 digest.
          image: ghcr.io/pfoseh-ops/ai-devsecops-platform:REPLACE_WITH_RELEASE_TAG
          env:
            - name: ENVIRONMENT
              value: production
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-devsecops-api
                  key: api-key
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-devsecops-demo
  namespace: ai-devsecops
spec:
  selector:
    app: ai-devsecops-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
